function startDistortedTitle(el, minLen = 8, maxLen = 14, tickMs = 80) {
  if (!el) return;
  // ensure the element can be transformed smoothly
  el.classList.add('distorted-moving');

  // charset uses the 16 letters + lowercase + digits + symbols (same as intro)
  const baseLetters = 'ABCDEFGHIJKLMNOP';
  const symbols = '!@#$%^&*()-_=+[]{};:,.<>?/\\|~`';
  const digits = '0123456789';
  const charset = (baseLetters + baseLetters.toLowerCase() + digits + symbols).split('');

  // clear existing
  if (window.__distortedTitleInterval) {
    clearInterval(window.__distortedTitleInterval);
    window.__distortedTitleInterval = null;
  }

  // pick length once, but jitter length slightly over time
  let currentLen = Math.floor(Math.random() * (maxLen - minLen + 1)) + minLen;

  window.__distortedTitleInterval = setInterval(() => {
    // occasionally nudge length by +/-1
    if (Math.random() < 0.12) {
      currentLen += (Math.random() < 0.5 ? -1 : 1);
      if (currentLen < minLen) currentLen = minLen;
      if (currentLen > maxLen) currentLen = maxLen;
    }
    // build random string
    let s = '';
    for (let i = 0; i < currentLen; i++) {
      s += charset[Math.floor(Math.random() * charset.length)];
    }
    el.textContent = s;

    // tiny movement jitter: translate ±(0-6) px x and y and slight rotation
    const tx = (Math.random() - 0.5) * 6; // -3 .. +3
    const ty = (Math.random() - 0.5) * 6; // -3 .. +3
    const rot = (Math.random() - 0.5) * 8; // -4deg .. +4deg
    const scale = 1 + (Math.random() - 0.5) * 0.02; // tiny scale
    el.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${scale})`;
  }, tickMs);
}

function stopDistortedTitle(el, restoreText) {
  if (!el) return;
  if (window.__distortedTitleInterval) {
    clearInterval(window.__distortedTitleInterval);
    window.__distortedTitleInterval = null;
  }
  el.classList.remove('distorted-moving');
  el.style.transform = '';
  if (typeof restoreText !== 'undefined') el.textContent = restoreText;
}

// small local random-string helper (safe, independent)
function randomStringGlobal(len) {
  const baseLetters = 'ABCDEFGHIJKLMNOP';
  const symbols = '!@#$%^&*()-_=+[]{};:,.<>?/\\|~`';
  const digits = '0123456789';
  const charset = (baseLetters + baseLetters.toLowerCase() + digits + symbols);
  let s = '';
  for (let i = 0; i < len; i++) s += charset.charAt(Math.floor(Math.random() * charset.length));
  return s;
}

const CUTSCENE_DURATION = 38; // seconds

// capture starting values at the moment the cutscene begins
const startStats_local = {
  playerMaxStart: player.maxHp,
  playerHpStart: player.hp,
  playerEnergyMaxStart: player.maxEnergy,
  playerEnergyStart: player.energy,
  bossMaxStart: boss.maxHp,
  bossHpStart: boss.hp
};

// final targets
const targets_local = {
  playerMaxTarget: 1080,
  playerHpTarget: 1080,
  playerEnergyMaxTarget: 550,
  playerEnergyTarget: 550,
  bossMaxTarget: 12000000,
  bossHpTarget: 12000000
};

const startStats = startStats_local;
const targets    = targets_local;

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lerp(a,b,t){ return a + (b - a) * t; }

function updateStatsRamp_local(videoTimeSec){
  const t = clamp(videoTimeSec / CUTSCENE_DURATION, 0, 1);

  player.maxHp = Math.floor(lerp(startStats_local.playerMaxStart, targets_local.playerMaxTarget, t));
  player.hp = Math.min(player.maxHp, Math.floor(lerp(startStats_local.playerHpStart, targets_local.playerHpTarget, t)));

  player.maxEnergy = Math.floor(lerp(startStats_local.playerEnergyMaxStart, targets_local.playerEnergyMaxTarget, t));
  player.energy = Math.min(player.maxEnergy, Math.floor(lerp(startStats_local.playerEnergyStart, targets_local.playerEnergyTarget, t)));

  boss.maxHp = Math.floor(lerp(startStats_local.bossMaxStart, targets_local.bossMaxTarget, t));
  boss.hp = Math.min(boss.maxHp, Math.floor(lerp(startStats_local.bossHpStart, targets_local.bossHpTarget, t)));

  // update the UI each tick
  updateUI();
}

}

let __rampFinished_local = false;

    // FORCE the exact end values (avoid rounding quirks)

(function runVersionSplash() {

  if (!versionSplashEl || !versionNameEl || !versionTextEl) return;

  const CLICK_VER = [16, 6, 7];

  let patchStepCount = 0;    // controls patch exponential speed
  let MIN_DELAY_MS = 1;

  // charset: 16 letters A-P (and lowercase), digits, symbols
  const baseLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; // 16 letters
  const symbols = '!@#$%^&*()-_=+[]{};:,.<>?/\\|~`';
  const digits = '0123456789';
  const fullCharset = (baseLetters + baseLetters.toLowerCase() + digits + symbols).split('');

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function fmtVer([M, m, p]) { return `${M}.${m}.${p}`; }
  function arraysEqual(a,b){ return a.length===b.length && a.every((v,i)=>v===b[i]); }
  function randomString(len, charset){
    let s = '';
    for (let i=0;i<len;i++) s += charset[Math.floor(Math.random()*charset.length)];
    return s;
  }

  // exponential params (tweak these for different acceleration feel)
  const baseDelay = 800;    // starting patch delay in ms
  const decayFactor = 0.67;  // <1 means exponential shrink per patch step

  // increment helpers (patch drives minor/major via wrap)
  function incrementPatch(){
    ver[2]++; // p
    if (ver[2] > 9) {
      ver[2] = 0;
      incrementMinor();
    }
  }
  function incrementMinor(){
    ver[1]++; // m
    // minor "wrap" into major
    if (ver[1] > 9) {
      ver[1] = 0;
      incrementMajor();
    }
  }
  function incrementMajor(){
    ver[0]++; // M
  }

  // main patch ticker - schedules itself with exponential delay

    // compute delay; step count increases each tick to shrink delay exponentially
    const raw = baseDelay * Math.pow(decayFactor, patchStepCount);
    const delay = Math.max(MIN_DELAY_MS, Math.floor(raw));

  let started = false;

function onTimeUpdateRamp() {
// Update ramp every tick based on video time

function startBossAutoAttack() {
  if (window.__bossAutoAttackTimer) return; // already scheduled

  const minDelay = 800;
  const maxDelay = 2400;
  const debounceMs = 600; // skip if last bossAction was within this many ms

  function scheduleNext() {
    // choose random delay (inclusive)
    const delay = rand(minDelay, maxDelay);
    window.__bossAutoAttackTimer = setTimeout(() => {
      window.__bossAutoAttackTimer = null;

      // safety: don't run if game ended
      if (typeof checkEnd === 'function' && checkEnd()) return;

      const now = Date.now();
      if ((now - (window.__lastBossActionCall || 0)) >= debounceMs) {
        try {
          // call bossAction; record timestamp
          if (typeof bossAction === 'function') {
            bossAction();
            window.__lastBossActionCall = Date.now();
          }
        } catch (e) {
          // swallow errors — we don't want this to kill the loop
          console.error('bossAutoAttack error', e);
        }
      }
      // schedule the next tick regardless
      scheduleNext();
    }, delay);
  }

  scheduleNext();
}

function stopBossAutoAttack() {
  if (window.__bossAutoAttackTimer) {
    clearTimeout(window.__bossAutoAttackTimer);
    window.__bossAutoAttackTimer = null;

}

function tryStartSpecial(attackFn) {
  if (window.__activeSpecialCount >= 3) return false;
  window.__activeSpecialCount++;
  try {
    attackFn(() => {
      // ensure count decremented when attack completes
      window.__activeSpecialCount = Math.max(0, window.__activeSpecialCount - 1);
    });
    return true;
  } catch (e) {
    // in case the attack throws, ensure we free the slot
    window.__activeSpecialCount = Math.max(0, window.__activeSpecialCount - 1);
    return false;
  }
}

// ——— BLINK→RAMP→FREEZE→FLASH ———
function runCycle(onComplete) {
  if (checkEnd()) return;
  // show crosshair
  vLine.style.display = 'block';
  hLine.style.display = 'block';

  frozen = false;
  vLine.style.width = '2px';
  hLine.style.height = '2px';
  vLine.style.background = hLine.style.background = 'rgba(255,0,0,0.5)';

  const start = performance.now();
  let interval = 500, nextToggle = start + interval;
  let visibleRed = true;

  function tick(now) {
    if (now >= nextToggle) {
      visibleRed = !visibleRed;
      const col = visibleRed ? 'rgba(255,0,0,0.5)' : 'rgba(255,255,255,0.5)';
      vLine.style.background = hLine.style.background = col;

      const elapsed = now - start;
      if (elapsed < 1800) {
        const frac = elapsed / 1800;
        interval = 500 - (400 * frac);
        nextToggle = now + interval;
        requestAnimationFrame(tick);
      } else {
        frozen = true;
        vLine.style.left = (cx - vLine.offsetWidth/2) + 'px';
        hLine.style.top  = (cy - hLine.offsetHeight/2) + 'px';
        freezeAndFlash(onComplete);
      }
    } else {
      requestAnimationFrame(tick);
    }
  }
  requestAnimationFrame(tick);
}

function bossCrosshairBatchAttack(count, onComplete) {
  const SPAWN_INTERVAL = 200; // ms between spawns
  const DET_DELAY      = 400; // ms after all spawned before detonation
  const THICK_PX       = 40;
  const HALF_THICK     = THICK_PX / 4;
  const FADE_DURATION  = 500;
  const CYCLES         = 3;

  let currentCycle = 0;

  function runCycle() {
    if (currentCycle >= CYCLES) {
      return onComplete();
    }
    currentCycle++;
    const markers = [];
    let spawned = 0;

    function spawnOne() {
      if (spawned >= count) {
        // all spawned: wait then detonate
        return setTimeout(detonateAll, DET_DELAY);
      }
      spawned++;
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      const v = vLine.cloneNode(), h = hLine.cloneNode();
      Object.assign(v.style, {

        left:    `${x - 1}px`,

        background: 'rgba(255,0,0,0.5)',
        transition: 'none'
      });
      Object.assign(h.style, {
        display: 'block',
        top:     `${y - 1}px`,
        height:  '2px',
        background: 'rgba(255,0,0,0.5)',
        transition: 'none'
      });
      document.body.append(v, h);
      markers.push({ x, y, v, h });
      setTimeout(spawnOne, SPAWN_INTERVAL);
    }

    function detonateAll() {
      // thicken & damage
      markers.forEach(({ x, y, v, h }) => {
        Object.assign(v.style, {
          width:      `${THICK_PX}px`,
          left:       `${x - HALF_THICK}px`,
          background: 'red'

          top:        `${y - HALF_THICK}px`,

        });
        if (Math.abs(cx - x) <= HALF_THICK || Math.abs(cy - y) <= HALF_THICK) {
          player.hp = Math.max(0, player.hp - 40);
		  log(`You were hit and took 40 damage!`);
          updateUI();

      markers.forEach(({ v, h }) => {
        v.style.transition = h.style.transition = `opacity ${FADE_DURATION}ms ease`;
        v.style.opacity = h.style.opacity = '0';
      });
      setTimeout(() => {
        markers.forEach(({ v, h }) => { v.remove(); h.remove(); });
        runCycle();
      }, FADE_DURATION);
    }

    spawnOne();
  }

  runCycle();
}

  function runOneCycle() {

    // start spawning translucent markers

  const SPAWN_DURATION   = 1500;  // total spawning time
  const ACT_DELAY        = 300;   // ms after spawn → detonate
  const FADE_DELAY       = 1000;  // ms after spawn → start fade
  const FADE_DURATION    = 500;   // ms fade-out time
  const THICK_PX         = 20;
  const HALF             = THICK_PX / 4;

  let currentCycle = 0;

  function runOneCycle() {
    if (currentCycle >= cycles) {
      return onComplete();
    }
	if (checkEnd()) return;

    let spawnCount = 0;
    let completed  = 0;
    let spawning   = true;

    const spawnTimer = setInterval(() => {
      if (!spawning) return;

      // record spawn
      spawnCount++;
      const x     = cx;
      const y     = cy;
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];

      // clone and position translucent marker
      const elV = vLine.cloneNode();

        left:       `${x - elV.offsetWidth/2}px`,

        opacity:    '1',
        transition: 'none'
      });
      Object.assign(elH.style, {
        display:    'block',
        top:        `${y - elH.offsetHeight/2}px`,
        height:     '2px',
        background: 'rgba(255,0,0,0.5)',
        opacity:    '1',
        transition: 'none'
      });
      document.body.append(elV, elH);

      // schedule this line’s detonation
      setTimeout(() => {
        Object.assign(elV.style, {
          left:       `${x - HALF}px`,
          width:      `${THICK_PX}px`,
          background: color
        });
        Object.assign(elH.style, {
          top:        `${y - HALF}px`,
          height:     `${THICK_PX}px`,
          background: color
        });
        if (Math.abs(cx - x) <= HALF || Math.abs(cy - y) <= HALF) {
          player.hp = Math.max(0, player.hp - 5);
          updateUI();
        }
      }, ACT_DELAY);

      // schedule fade-out 1 s after spawn
      setTimeout(() => {
        elV.style.transition = `opacity ${FADE_DURATION}ms ease`;
        elH.style.transition = `opacity ${FADE_DURATION}ms ease`;
        elV.style.opacity    = '0';
        elH.style.opacity    = '0';
      }, FADE_DELAY);

      // schedule removal + cycle completion check
      setTimeout(() => {
        elV.remove();
        elH.remove();
        completed++;
        // if spawning has ended and we've removed all spawns, next cycle
        if (!spawning && completed === spawnCount) {
          currentCycle++;
          runOneCycle();
        }
      }, FADE_DELAY + FADE_DURATION);
    }, SPAWN_INTERVAL);

    // stop spawning after SPAWN_DURATION
    setTimeout(() => {
      spawning = false;
      clearInterval(spawnTimer);
      // if nothing spawned, immediately move to next cycle
      if (spawnCount === 0) {
        currentCycle++;
        runOneCycle();
      }
    }, SPAWN_DURATION);
  }

  runOneCycle();
}

function bossRotatingLaserAttack(onComplete) {
  const THICK_PX         = 120;
  const HALF_THICK       = THICK_PX / 12;
  const DOT_SIZE         = THICK_PX * 2;
  const BLINK_INTERVAL   = 250;
  const WARNING_DURATION = 670;
  const DAMAGE_INTERVAL  = 10;
  const DAMAGE_PER_TICK  = 5;
  const START_SPEED      = 0.1;
  const MAX_SPEED_FACTOR = 1;
  const END_SLOWDOWN_DEG = 30;
  const TOTAL_ANGLE      = 1320;
  const ACCEL_ANGLE      = 180 ;
  const FADE_DURATION    = 500;

  const cx0 = window.innerWidth  / 2;
  const cy0 = window.innerHeight / 2;

  const dot = document.createElement('div');
  Object.assign(dot.style, {
    position:       'absolute',
    width:          `${DOT_SIZE}px`,
    height:         `${DOT_SIZE}px`,
    borderRadius:   '50%',
    border:         '2px solid #440047',
    background:     '#b500a0',
    left:           `${cx0 - DOT_SIZE / 2}px`,
    top:            `${cy0 - DOT_SIZE / 2}px`,
    pointerEvents:  'none',
    zIndex:         '1001',
    transition:     'background 0.1s, width 0.3s ease, height 0.3s ease, left 0.3s ease, top 0.3s ease'
  });
  document.body.append(dot);

  let showRed = true;
  const blinkTimer = setInterval(() => {
    dot.style.background = showRed ? 'white' : '#b500a0';
    showRed = !showRed;
  }, BLINK_INTERVAL);

  setTimeout(() => {
    clearInterval(blinkTimer);
    Object.assign(dot.style, {
      width:        `${THICK_PX}px`,
      height:       `${THICK_PX}px`,
      left:         `${cx0 - HALF_THICK}px`,
      top:          `${cy0 - HALF_THICK}px`,
      background:   '#b500a0'
    });

    const beam = document.createElement('div');
    Object.assign(beam.style, {
      position:        'absolute',
      width:           `${THICK_PX}px`,
      height:          '5000px',
      background:      '#b500a0',
      border:          '1px solid #440047',
      borderRadius:    `${THICK_PX}px`,
      pointerEvents:   'none',
      transformOrigin: 'center bottom',
      left:            `${cx0 - HALF_THICK}px`,
      bottom:          `${cy0}px`,
      transform:       'rotate(0deg)',
      zIndex:          '1000',
      transition:      `opacity ${FADE_DURATION}ms ease`
    });
    document.body.append(beam);

    let currentAngle = 0;
    const direction = Math.random() < 0.5 ? 1 : -1;
    let lastTime = null;

    const damageTimer = setInterval(() => {
      const rad = (currentAngle * Math.PI) / 180;
      const ux = Math.sin(rad), uy = -Math.cos(rad);
      const vx = cx - cx0, vy = cy - cy0;
      const perpDist = Math.abs(vx * uy - vy * ux);
      const fwdDist = vx * ux + vy * uy;
      if (fwdDist > 0 && perpDist <= HALF_THICK) {
        player.hp = Math.max(0, player.hp - DAMAGE_PER_TICK);
        updateUI();
      }
	  if (checkEnd()) return;
    }, DAMAGE_INTERVAL);

    function step(time) {
      if (lastTime == null) lastTime = time;
      const dt = time - lastTime;
      const absAngle = Math.abs(currentAngle);

      // speed ramps up until ACCEL_ANGLE, then down near end
      let factor = 1;
      if (absAngle < ACCEL_ANGLE) {
        factor = 1 + ((MAX_SPEED_FACTOR - 1) * (absAngle / ACCEL_ANGLE));
      } else if (absAngle > TOTAL_ANGLE - END_SLOWDOWN_DEG) {
        const slowRatio = (TOTAL_ANGLE - absAngle) / END_SLOWDOWN_DEG;
        factor = 1 + ((MAX_SPEED_FACTOR - 1) * slowRatio);
      } else {
        factor = MAX_SPEED_FACTOR;
      }

      const speed = START_SPEED * factor;
      currentAngle += direction * speed * dt;
      beam.style.transform = `rotate(${currentAngle}deg)`;

      if (Math.abs(currentAngle) < TOTAL_ANGLE) {
        lastTime = time;
        requestAnimationFrame(step);
      } else {
        // Begin fade-out
        clearInterval(damageTimer);
        beam.style.opacity = '0';
        setTimeout(() => {
          beam.remove();
          dot.remove();
          onComplete();
        }, FADE_DURATION);
      }
    }

    requestAnimationFrame(step);
  }, WARNING_DURATION);
}

function clearActiveLineAttacks() {
  // remove only elements we explicitly created for telegraphs
  document.querySelectorAll('.attack-marker').forEach(el => el.remove());

  if (typeof randomLineAttackInterval !== 'undefined' && randomLineAttackInterval) {
    clearInterval(randomLineAttackInterval);
    randomLineAttackInterval = null;
  }

  // clear stored enrage/special intervals if any
  if (Array.isArray(window.__enrageIntervals) && window.__enrageIntervals.length) {
    window.__enrageIntervals.forEach(id => clearInterval(id));
    window.__enrageIntervals = [];

  clearSpecialIntervals();

    transform: 'translate(-50%, -50%)',
    pointerEvents: 'none',
    zIndex: '900',             // ABOVE normal UI, BELOW special-attacks (1000+)
    width: '850px',            // increased by ~30%
    maxWidth: '78vw',
    height: 'auto',
    display: 'block',
    opacity: '1',
    transition: '' // transitions applied later
  });

  // audio
  const audio = new Audio('screamofgod.mp3');
  audio.loop = false;
  audio.preload = 'auto';
  audio.volume = (typeof audio.volume === 'number') ? audio.volume : 1;
  audio.play().catch(() => { /* autoplay blocked; ignore */ });

  // append
  document.body.appendChild(img);

  // ---- LIGHT, FREQUENT SHAKE for first 2 seconds ----
  if (!window.__jumpscareShaking) {
    window.__jumpscareShaking = true;
    const shakeDuration = 2000; // ms (first 2s)
    const magnitude = 16;        // px (smaller, but frequent — "very shaky")
    const start = performance.now();
    const origBodyTransform = document.body.style.transform || '';
    const origBodyTransition = document.body.style.transition || '';

    function shakeFrame(now) {
      const elapsed = now - start;
      if (elapsed < shakeDuration) {
        // small jitter (no rotation)
        const dx = (Math.random() - 0.5) * magnitude * 2;
        const dy = (Math.random() - 0.5) * magnitude * 2;
        document.body.style.transform = `translate(${dx}px, ${dy}px)`;
        requestAnimationFrame(shakeFrame);
      } else {
        // smoothly restore body transform
        document.body.style.transition = 'transform 200ms ease-out';
        document.body.style.transform = origBodyTransform;
        setTimeout(() => {
          document.body.style.transition = origBodyTransition;
          window.__jumpscareShaking = false;
        }, 220);
      }
    }
    requestAnimationFrame(shakeFrame);
  }

  // ---- BOSS UI fade: start at t = 2000ms, fade over 1000ms ----
  const bossBar = document.getElementById('boss-bar');
  const origBossTransition = bossBar ? bossBar.style.transition : '';
  const origBossOpacity = bossBar ? (bossBar.style.opacity || '') : '';

  setTimeout(() => {
    // Fade GIF out over 1s
    img.style.transition = 'opacity 1000ms linear';
    img.style.opacity = '0';

    // Fade boss UI out (if it exists)
    if (bossBar) {
      bossBar.style.transition = 'opacity 1000ms linear';
      bossBar.style.opacity = '0';
    }
  }, 2000);

  // ---- cleanup: after 3s, remove gif & audio and restore boss UI ----
  setTimeout(() => {
    try { img.remove(); } catch (e) {}
    try { audio.pause(); audio.currentTime = 0; } catch (e) {}

    // restore boss UI (fade back in)
    if (bossBar) {
      bossBar.style.transition = 'opacity 600ms linear';
      bossBar.style.opacity = '1';
      setTimeout(() => {
        bossBar.style.transition = origBossTransition;
        if (origBossOpacity !== '') bossBar.style.opacity = origBossOpacity;
      }, 700);
    }
  }, 3000);
}

function startJumpscareTicker() {
  if (window.__jumpscareInterval) return; // already running
  window.__jumpscareInterval = setInterval(() => {
    const last = window.__lastJumpscareTime || 0;
    if (Date.now() - last < 30000) return; // 30s cooldown
    if (Math.random() < 0.01) {
      showJumpscare();
    }
  }, 1000);
}

function stopJumpscareTicker() {
  if (window.__jumpscareInterval) {
    clearInterval(window.__jumpscareInterval);
    window.__jumpscareInterval = null;
  }
}

  function formatDuration(ms) {
    let totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    totalSec %= 3600;
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${h}h ${m}m ${s}s`;
  }


function startRegen() {
  // guard to avoid duplicate intervals
  if (window.__hpRegenInterval) clearInterval(window.__hpRegenInterval);
  if (window.__mpRegenInterval) clearInterval(window.__mpRegenInterval);

  // HP: +1 per second
  window.__hpRegenInterval = setInterval(() => {
    if (typeof player === 'undefined') return;
    if (player.hp < player.maxHp) {
      player.hp = Math.min(player.maxHp, player.hp + 1);
      updateUI();
    }
    // stop if game ended
    if (checkEnd()) clearRegen();
  }, 1000);

  // Energy (mana): +1 per 0.2s
  function setupMpRegenInterval() {
    // clear prior
    if (window.__mpRegenInterval) { clearInterval(window.__mpRegenInterval); window.__mpRegenInterval = null; }

    const tickMs = 200;                      // base tick
    const addPerTick = enraged ? 2 : 1;      // doubled when enraged
	const addPerTk = enraged ? 2 : 1;

    window.__mpRegenInterval = setInterval(() => {
      if (typeof player === 'undefined') return;
      if (player.energy < player.maxEnergy) {
        player.energy = Math.min(player.maxEnergy, player.energy + addPerTick);
		player.hp = Math.min(player.maxHp, player.hp + addPerTk);
        updateUI();
      }
      if (checkEnd()) clearRegen();
    }, tickMs);
  }

  // call helper to establish the interval
  setupMpRegenInterval();

  // expose helper so we can reconfigure it when enraged toggles
  window.__setupMpRegenInterval = setupMpRegenInterval;
}

function clearRegen() {
  if (window.__hpRegenInterval) { clearInterval(window.__hpRegenInterval); window.__hpRegenInterval = null; }
  if (window.__mpRegenInterval) { clearInterval(window.__mpRegenInterval); window.__mpRegenInterval = null; }
}

function flashHealthbar() {
  const fill = document.querySelector('#player-bar .bar-fill');
  const orig = window.getComputedStyle(fill).backgroundColor;
  fill.style.backgroundColor = 'red';
  setTimeout(() => (fill.style.backgroundColor = orig), 300);
}

// — helper to fade out audio (used later) —
function fadeOutAudio(audio, duration = 2000, onComplete) {
  const stepTime = 100;
  const step = audio.volume / (duration / stepTime);
  const fade = setInterval(() => {
    if (audio.volume > step) {
      audio.volume = Math.max(0, audio.volume - step);
    } else {
      clearInterval(fade);
      audio.volume = 0;
      if (onComplete) onComplete();
    }
  }, stepTime);
}
